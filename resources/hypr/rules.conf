# this file contains my rules
## layer
layerrule = blur on, match:namespace walker

## window
windowrule {
  name = move-kitty
  match:class = kitty

  move = 100 100
  animation = slide
}

windowrule {
    name = steam
    match:class = steam

    tile = on
    monitor = desc:AOC
    workspace = 3
}

windowrule {
    name = steam-app
    match:class = steam_app.*

    fullscreen = on
    tile = on
    monitor = desc:AOC
    workspace = 3
}

windowrule {
    name = librewolf-popup
    match:class = librewolf
    match:float = true
    match:modal = true

    size = 600 300
    center = true
}
## Workspace
workspace = 1, on-created-empty:librewolf
workspace = 2, on-created-empty:kitty tmux new -As0
workspace = 3, on-created-empty:steam
