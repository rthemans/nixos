windowrule {
  name = move-kitty
  match:class = kitty

  move = 100 100
  animation = slide
}

windowrule {
    name = steam
    match:class = steam

    tile = on
    monitor = desc:AOC
    workspace = 3
}

windowrule {
    name = disable-idle
    match:class = steam_app.*

    idle_inhibit = always
}

windowrule {
    name = steam-app
    match:class = steam_app.*

    tile = on
    monitor = desc:AOC
    workspace = 3
}


windowrule {
    name = citrix
    match:class = Wfica

    fullscreen = on
    tile = on
    monitor = desc:AOC
    workspace = 5
}

workspace = 1, on-created-empty:qutebrowser
workspace = 2, on-created-empty:kitty tmux new -As0
workspace = 3, on-created-empty:discord
